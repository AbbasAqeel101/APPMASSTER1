name: Release

on:
  push:
    tags:
      - v*
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3
        with:
          submodules: 'true'

      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode_26.3.0.app

      # Xcode downloads the binary packages (IDevice, LicensePlistBinary) in parallel and
      # sometimes fails with "already exists in file system". Resolve them first, retrying
      # (without deleting what a previous attempt already downloaded), and let the build reuse them.
      - name: Resolve Swift packages
        run: |
          ok=0
          for i in 1 2 3 4 5; do
            if xcodebuild -resolvePackageDependencies -project Feather.xcodeproj -scheme Feather -clonedSourcePackagesDirPath SourcePackages; then
              ok=1
              break
            fi
            echo "resolve attempt $i failed, retrying"
            sleep 15
          done
          if [ "$ok" != "1" ]; then
            echo "could not resolve packages"
            exit 1
          fi

      - name: Compile AppMaster
        run: |
          agvtool new-version -all $(git rev-parse HEAD)
          make
          mkdir upload
          mv packages/* upload/

      # Upload the built files so the release job doesn't need to
      # rebuild from scratch if anything below fails.
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: feather-build
          path: upload/
          retention-days: 1

  release:
    needs: build
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: feather-build
          path: upload

      - name: Extract Version
        id: get_version
        run: |
          # Read the version straight from the packaged IPA itself
          # (always uses the correct iOS-style Info.plist layout,
          # regardless of what the last local build folder looked like).
          unzip -p upload/AppMaster.ipa 'Payload/*.app/Info.plist' > /tmp/Info.plist
          VERSION=$(/usr/libexec/PlistBuddy -c "Print CFBundleShortVersionString" /tmp/Info.plist)
          echo "VERSION=${VERSION}" >> $GITHUB_ENV

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: AppMaster v${{ env.VERSION }}
          tag_name: v${{ env.VERSION }}
          files: |
            upload/*
          generate_release_notes: true
          fail_on_unmatched_files: true
          draft: false
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
