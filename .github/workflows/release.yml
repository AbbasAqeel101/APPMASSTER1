name: Release

on:
  push:
    tags:
      - v*
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3
        with:
          submodules: 'true'

      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode_26.3.0.app

      # Xcode fails to download the two binary packages (IDevice, LicensePlistBinary) with
      # "already exists in file system". Download them here with curl (with retries), put
      # them in a private package cache so Xcode finds them ready, and resolve once.
      - name: Resolve Swift packages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          CACHE="$RUNNER_TEMP/spm-cache"
          rm -rf "$CACHE" SourcePackages
          mkdir -p "$CACHE/artifacts"

          for url in \
            "https://github.com/jkcoxson/idevice/releases/download/v0.1.57/IDevice.xcframework.zip" \
            "https://github.com/mono0926/LicensePlist/releases/download/3.27.1/LicensePlistBinary-macos.artifactbundle.zip"
          do
            name=$(printf '%s' "$url" | sed 's/[^A-Za-z0-9]/_/g')
            curl -fsSL --retry 8 --retry-delay 5 --retry-all-errors \
              -H "Authorization: Bearer $GH_TOKEN" \
              -o "$CACHE/artifacts/$name" "$url"
            ls -l "$CACHE/artifacts/$name"
            shasum -a 256 "$CACHE/artifacts/$name"
          done

          echo "PKG_CACHE=$CACHE" >> "$GITHUB_ENV"

          ok=0
          for i in 1 2 3; do
            if xcodebuild -resolvePackageDependencies -project Feather.xcodeproj -scheme Feather \
              -clonedSourcePackagesDirPath SourcePackages -packageCachePath "$CACHE"; then
              ok=1
              break
            fi
            echo "resolve attempt $i failed, retrying"
            sleep 10
          done
          if [ "$ok" != "1" ]; then
            echo "could not resolve packages"
            exit 1
          fi
          ls SourcePackages/artifacts || true

      - name: Compile AppMaster
        run: |
          agvtool new-version -all $(git rev-parse HEAD)
          make
          mkdir upload
          mv packages/* upload/

      # Upload the built files so the release job doesn't need to
      # rebuild from scratch if anything below fails.
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: feather-build
          path: upload/
          retention-days: 1

  release:
    needs: build
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: feather-build
          path: upload

      - name: Extract Version
        id: get_version
        run: |
          # Read the version straight from the packaged IPA itself
          # (always uses the correct iOS-style Info.plist layout,
          # regardless of what the last local build folder looked like).
          unzip -p upload/AppMaster.ipa 'Payload/*.app/Info.plist' > /tmp/Info.plist
          VERSION=$(/usr/libexec/PlistBuddy -c "Print CFBundleShortVersionString" /tmp/Info.plist)
          echo "VERSION=${VERSION}" >> $GITHUB_ENV

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: AppMaster v${{ env.VERSION }}
          tag_name: v${{ env.VERSION }}
          files: |
            upload/*
          generate_release_notes: true
          fail_on_unmatched_files: true
          draft: false
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
